<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BDXN59P3J3"></script>
<script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>年度上班日倒數計時器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Hiragino Sans", sans-serif;
    }
    body {
      background: #f8f6f0;
      color: #4a443f;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }
    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(60, 54, 51, 0.05);
      border: 1px solid #ebe5dc;
      padding: 34px 26px 28px;
      position: relative;
    }

    /* 頂部手繪小植物線條 */
    .top-deco {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .top-deco svg {
      width: 24px;
      height: 24px;
      stroke: #a89f96;
      stroke-width: 1.5;
      fill: none;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 24px;
      color: #3c3633;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    h1 svg {
      width: 20px;
      height: 20px;
      stroke: #7d756d;
      stroke-width: 1.6;
      fill: none;
    }

    /* 核心倒數卡片 */
    .result-card {
      background: #f7f4ee;
      border-radius: 10px;
      padding: 24px 20px 20px;
      text-align: center;
      margin-bottom: 24px;
      border: 1px solid #e7e0d5;
      position: relative;
    }
    .range-label {
      font-size: 0.82rem;
      color: #7d756d;
      letter-spacing: 0.03em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .range-label svg {
      width: 14px;
      height: 14px;
      stroke: #8c837b;
      stroke-width: 1.6;
      fill: none;
    }

    .count-wrapper {
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      position: relative;
    }
    .days-count {
      font-size: 3.4rem;
      font-weight: 700;
      color: #3c3633;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .days-unit {
      font-size: 0.95rem;
      font-weight: 400;
      color: #7d756d;
      margin-left: 6px;
    }

    /* 日系閃光裝飾 */
    .sparkle-icon {
      position: absolute;
      top: -6px;
      right: -18px;
      width: 16px;
      height: 16px;
      stroke: #b5aba1;
      stroke-width: 1.5;
      fill: none;
    }

    .breakdown {
      font-size: 0.8rem;
      color: #8c837b;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* 精準時段溫暖小語區塊 */
    .quote-box {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px dashed #e2dbcf;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .quote-box svg {
      width: 14px;
      height: 14px;
      stroke: #a89f96;
      stroke-width: 1.5;
      fill: none;
      flex-shrink: 0;
    }
    .quote-text {
      font-size: 0.82rem;
      color: #6e655f;
      letter-spacing: 0.04em;
      line-height: 1.5;
      font-style: normal;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #5c544e;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title svg {
      width: 16px;
      height: 16px;
      stroke: #7d756d;
      stroke-width: 1.6;
      fill: none;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="date"] {
      flex: 1;
      padding: 9px 12px;
      background: #faf9f6;
      border: 1px solid #ddd6cb;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #4a443f;
      outline: none;
      transition: border 0.2s;
    }
    input[type="date"]:focus {
      border-color: #8c837b;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 9px 16px;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-add {
      background: #5c544e;
      color: #ffffff;
    }
    .btn-add:hover {
      background: #4a443f;
    }
    .btn-clear {
      background: #faf8f5;
      color: #8c837b;
      border: 1px solid #e7e0d5;
      width: 100%;
      margin-top: 10px;
      padding: 8px 12px;
    }
    .btn-clear:hover {
      background: #f0eae1;
      color: #5c544e;
    }
    .btn-clear svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.6;
      fill: none;
    }

    .holiday-list {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid #ebe5dc;
      border-radius: 6px;
      padding: 6px 12px;
      margin-bottom: 8px;
      background: #faf9f6;
    }
    .holiday-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 0.85rem;
      border-bottom: 1px dashed #e2dbcf;
      color: #5c544e;
    }
    .holiday-item:last-child {
      border-bottom: none;
    }
    .btn-del {
      background: transparent;
      color: #a39990;
      padding: 2px 6px;
      font-size: 0.78rem;
      border-radius: 4px;
    }
    .btn-del:hover {
      color: #c53030;
      background: #faeae8;
    }
    .empty-tip {
      font-size: 0.82rem;
      color: #a89f96;
      text-align: center;
      padding: 16px 0;
    }

    /* 日系極簡 - 喝咖啡按鈕 */
    .support-section {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 1px solid #ebe5dc;
      text-align: center;
    }
    .support-tip {
      font-size: 0.78rem;
      color: #9a9087;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .coffee-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #ffffff;
      color: #4a443f;
      border: 1px solid #ddd6cb;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      padding: 9px 18px;
      border-radius: 6px;
      box-shadow: 0 1px 3px rgba(60, 54, 51, 0.03);
      transition: all 0.25s ease;
    }
    .coffee-btn:hover {
      background-color: #4a443f;
      color: #ffffff;
      border-color: #4a443f;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(60, 54, 51, 0.1);
    }
    .coffee-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 1.5;
      fill: none;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="top-deco">
    <svg viewBox="0 0 24 24">
      <path d="M12 21V10M12 10C12 7 9 4 5 5C5 9 8 11 12 10ZM12 14C14 12 18 12 19 15C16 17 13 16 12 14Z" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1>
    <svg viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="17" rx="3" stroke-linecap="round"/>
      <path d="M3 9H21M8 2V5M16 2V5" stroke-linecap="round"/>
      <circle cx="8" cy="14" r="1" fill="#7d756d"/>
      <circle cx="12" cy="14" r="1" fill="#7d756d"/>
      <circle cx="16" cy="14" r="1" fill="#7d756d"/>
    </svg>
    年度上班日倒數
  </h1>

  <div class="result-card">
    <div class="range-label" id="date-range-text">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7V12L15 14" stroke-linecap="round"/>
      </svg>
      <span>計算區間載入中...</span>
    </div>

    <div class="count-wrapper">
      <div class="days-count" id="workday-count">--</div>
      <span class="days-unit">天</span>
      <svg class="sparkle-icon" viewBox="0 0 24 24">
        <path d="M12 2L13.8 8.2L20 10L13.8 11.8L12 18L10.2 11.8L4 10L10.2 8.2L12 2Z" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="breakdown" id="breakdown-text">週末與休假已自動扣除</div>

    <!-- 精準時段溫暖小語 -->
    <div class="quote-box">
      <svg viewBox="0 0 24 24">
        <path d="M3 21C3 21 4 18 4 14C4 9.5 7.5 6 12 6C16.5 6 20 9.5 20 14C20 18 21 21 21 21" stroke-linecap="round"/>
        <path d="M9 13H15M9 17H13" stroke-linecap="round"/>
      </svg>
      <div class="quote-text" id="quote-display">今天也辛苦了，放慢腳步喝杯溫熱的茶吧。</div>
    </div>
  </div>

  <div class="section-title">
    <svg viewBox="0 0 24 24">
      <path d="M19 3H5C3.89 3 3 3.9 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3Z" stroke-linecap="round"/>
      <path d="M7 7H17M7 11H14M7 15H11" stroke-linecap="round"/>
    </svg>
    自訂排休日（平日請假／國定假日）
  </div>
  
  <div class="input-row">
    <input type="date" id="holiday-input">
    <button class="btn-add" id="btn-add">
      <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
        <path d="M12 5V19M5 12H19" stroke-linecap="round"/>
      </svg>
      新增
    </button>
  </div>

  <ul class="holiday-list" id="holiday-list"></ul>

  <button class="btn-clear" id="btn-clear">
    <svg viewBox="0 0 24 24">
      <path d="M19 7L18.1 19C18.05 19.55 17.6 20 17.05 20H6.95C6.4 20 5.95 19.55 5.9 19L5 7M10 11V16M14 11V16M4 7H20M9 7V4C9 3.45 9.45 3 10 3H14C14.55 3 15 3.45 15 4V7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    清空所有排休日
  </button>

  <div class="support-section">
    <div class="support-tip">
      <span>陪你一起數著日子前進</span>
    </div>
    <a href="https://buymeacoffee.com/你的用戶名稱" target="_blank" rel="noopener noreferrer" class="coffee-btn">
      <svg viewBox="0 0 24 24">
        <path d="M4 8H17C18.1 8 19 8.9 19 10V11C19 12.1 18.1 13 17 13H4V8Z" stroke-linecap="round"/>
        <path d="M4 8V16C4 17.7 5.3 19 7 19H14C15.7 19 17 17.7 17 16V8" stroke-linecap="round"/>
        <path d="M7 2C7 3.5 6 4 6 5.5M11 2C11 3.5 10 4 10 5.5M15 2C15 3.5 14 4 14 5.5" stroke-linecap="round"/>
        <path d="M2 21H20" stroke-linecap="round"/>
      </svg>
      <span>請作者喝杯咖啡</span>
    </a>
  </div>
</div>

<script>
  const STORAGE_KEY = 'custom_holidays_list';

  // 星期 × 時段 二維溫暖生活語錄庫
  const contextualQuotes = {
    // 週一：溫和收假與起步
    1: {
      morning: [
        "週一早晨，慢慢開機就好，給自己泡一杯溫熱的咖啡吧。",
        "新的一週輕輕開始，不用急著跑，一步一步走就很穩。"
      ],
      afternoon: [
        "週一午後最容易犯困，起來喝口溫水、動動肩頸吧。",
        "前半天已經順利度過，下午按照自己的步調前進。"
      ],
      evening: [
        "平安撐過每週最難熬的週一，今晚好好吃頓飯慰勞自己。",
        "最需要勇氣的第一天結束了，今晚早點休息吧。"
      ]
    },

    // 週三：小週末喘息與平衡
    3: {
      morning: [
        "不知不覺來到週三早晨，本週的峰頂今天就要跨過了！",
        "週三早安，今天適合帶一份喜歡的早餐給自己打氣。"
      ],
      afternoon: [
        "小週末午後，為撐過前半週的自己拍拍肩，吃點小點心吧。",
        "一週最重要的轉折點已過，接下來的步伐會越來越輕盈。"
      ],
      evening: [
        "週三夜晚，留點時間給自己喜歡的書、音樂或熱茶吧。",
        "小週末收工！今晚很適合稍微放鬆一下，不必把弦繃得太緊。"
      ]
    },

    // 週五：放假前夕期待與收尾
    5: {
      morning: [
        "週五早安！最後一天工作天，空氣彷彿都帶著假期的香氣。",
        "準備迎接週末，今天帶著愉快的心情把待辦事項收尾吧。"
      ],
      afternoon: [
        "週五午後，再堅持一下，今晚的自由時光正在前方等著你！",
        "整理桌面與收尾郵件，週末倒數已經進入尾聲囉。"
      ],
      evening: [
        "辛苦了一整週！今晚把所有工作清單放下，週末正式開始 🎉",
        "下班快樂！今晚屬於完全自由的自己，盡情享受假期吧。"
      ]
    },

    // 週二、週四與週末：平穩日常
    default: {
      morning: [
        "早安，深呼吸一次，過好每一個今天，明天就會更溫柔。",
        "清晨的陽光很舒服，今天也用穩健的步伐前進。"
      ],
      afternoon: [
        "午後時光，累了就抬頭看看窗外，給自己五分鐘的放空。",
        "下午的專注時段，一步一步完成手邊的事項碎片。"
      ],
      evening: [
        "夕陽西下，把今天交給努力，把夜晚溫柔留給自己。",
        "今天也辛苦了，收拾好心情，準備迎接平靜的夜晚。"
      ]
    }
  };

  // 取得當前時段（早晨、午後、傍晚/夜間）
  function getTimeSlot() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour < 12) {
      return 'morning';
    } else if (hour >= 12 && hour < 17) {
      return 'afternoon';
    } else {
      return 'evening';
    }
  }

  // 依當前星期與時段隨機選取問候語
  function setRandomQuote() {
    const dayOfWeek = today.getDay();
    const timeSlot = getTimeSlot();

    const dayQuotes = contextualQuotes[dayOfWeek] || contextualQuotes.default;
    const quotesList = dayQuotes[timeSlot] || dayQuotes.afternoon;

    const randomIndex = Math.floor(Math.random() * quotesList.length);
    document.getElementById('quote-display').innerText = quotesList[randomIndex];
  }

  const today = new Date();
  const year = today.getFullYear();
  const startDate = new Date(year, today.getMonth(), today.getDate() + 1);
  const endDate = new Date(year, 11, 31);

  function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  const holidayInput = document.getElementById('holiday-input');
  holidayInput.min = formatDate(startDate);
  holidayInput.max = formatDate(endDate);
  holidayInput.value = formatDate(startDate);

  function getStoredHolidays() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveStoredHolidays(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function calculate() {
    const holidays = getStoredHolidays();
    const holidaySet = new Set(holidays);

    let remainingWorkdays = 0;
    let customHolidayDeducted = 0;

    let curr = new Date(startDate);
    while (curr <= endDate) {
      const dayOfWeek = curr.getDay();
      const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
      const dateStr = formatDate(curr);

      if (!isWeekend) {
        if (holidaySet.has(dateStr)) {
          customHolidayDeducted++;
        } else {
          remainingWorkdays++;
        }
      }
      curr.setDate(curr.getDate() + 1);
    }

    document.getElementById('date-range-text').innerHTML = `
      <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#8c837b;stroke-width:1.6;fill:none;">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7V12L15 14" stroke-linecap="round"/>
      </svg>
      <span>計算區間：${formatDate(startDate)} ～ ${formatDate(endDate)}</span>
    `;

    document.getElementById('workday-count').innerText = remainingWorkdays;
    document.getElementById('breakdown-text').innerText = 
      `已扣除週末與 ${customHolidayDeducted} 天平日排休`;

    renderHolidayList(holidays);
  }

  function renderHolidayList(holidays) {
    const listEl = document.getElementById('holiday-list');
    listEl.innerHTML = '';

    if (holidays.length === 0) {
      listEl.innerHTML = '<li class="empty-tip">尚未加入任何自訂排休日</li>';
      return;
    }

    holidays.sort().forEach(dateStr => {
      const li = document.createElement('li');
      li.className = 'holiday-item';
      
      const d = new Date(dateStr + 'T00:00:00');
      const dayOfWeekStr = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];

      li.innerHTML = `
        <span>${dateStr} (週${dayOfWeekStr})</span>
        <button class="btn-del" onclick="deleteHoliday('${dateStr}')">刪除</button>
      `;
      listEl.appendChild(li);
    });
  }

  document.getElementById('btn-add').addEventListener('click', () => {
    const val = holidayInput.value;
    if (!val) return;

    let holidays = getStoredHolidays();
    if (!holidays.includes(val)) {
      holidays.push(val);
      saveStoredHolidays(holidays);
      calculate();
    }
  });

  window.deleteHoliday = function(dateStr) {
    let holidays = getStoredHolidays();
    holidays = holidays.filter(item => item !== dateStr);
    saveStoredHolidays(holidays);
    calculate();
  };

  document.getElementById('btn-clear').addEventListener('click', () => {
    if (confirm('確定要清空所有已輸入的排休日嗎？')) {
      localStorage.removeItem(STORAGE_KEY);
      calculate();
    }
  });

  // 初次執行問候語選取與天數計算
  setRandomQuote();
  calculate();
</script>
</body>
</html>
