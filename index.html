<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年度上班日倒數計時器</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .result-box {
            background: #eef2f7;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        .days-count {
            font-size: 3rem;
            font-weight: bold;
            color: #3498db;
            margin: 10px 0;
        }
        .date-range {
            font-size: 0.9rem;
            color: #7f8c8d;
        }
        .section-title {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
            color: #34495e;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="date"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        button {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }
        button:hover {
            background: #27ae60;
        }
        .leave-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .leave-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }
        .leave-item:last-child {
            border-bottom: none;
        }
        .btn-delete {
            background: #e74c3c;
            padding: 4px 8px;
            font-size: 0.8rem;
        }
        .btn-delete:hover {
            background: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="title">年度工作天倒數</h1>
    
    <div class="result-box">
        <div>剩餘工作天數</div>
        <div class="days-count" id="workingDaysCount">0</div>
        <div class="date-range" id="dateRangeText">計算期間：-- 至 --</div>
    </div>

    <div class="section-title">新增特休 / 請假日</div>
    <div class="input-group">
        <input type="date" id="leaveDateInput">
        <button onclick="addLeaveDate()">新增</button>
    </div>

    <div class="section-title">已設定的特休列表</div>
    <ul class="leave-list" id="leaveList">
        <!-- 動態產生 -->
    </ul>
</div>

<script>
    // 初始化日期：明天與今年12/31
    const today = new Date();
    const tomorrow = new Date(today);
    tomorrow.setDate(today.getDate() + 1);
    
    const currentYear = today.getFullYear();
    const endOfYear = new Date(currentYear, 11, 31); // 11 代表 12 月

    // 從本地儲存空間載入特休日期
    let customLeaves = JSON.parse(localStorage.getItem('customLeaves')) || [];

    // 格式化日期為 YYYY-MM-DD
    function formatDate(date) {
        return date.toISOString().split('T')[0];
    }

    // 初始化網頁文字
    document.getElementById('title').innerText = `${currentYear} 年上班日倒數計時器`;
    document.getElementById('dateRangeText').innerText = `計算期間：${formatDate(tomorrow)} 至 ${formatDate(endOfYear)}`;
    document.getElementById('leaveDateInput').min = formatDate(tomorrow);
    document.getElementById('leaveDateInput').max = formatDate(endOfYear);

    // 計算核心邏輯
    function calculateWorkingDays() {
        let count = 0;
        let currentDate = new Date(tomorrow);

        // 跑迴圈逐日檢查
        while (currentDate <= endOfYear) {
            const dayOfWeek = currentDate.getDay(); // 0 是週日，6 是週六
            const dateStr = formatDate(currentDate);

            // 條件：不是六日，且不在自訂特休名單內
            if (dayOfWeek !== 0 && dayOfWeek !== 6 && !customLeaves.includes(dateStr)) {
                count++;
            }
            currentDate.setDate(currentDate.getDate() + 1);
        }

        document.getElementById('workingDaysCount').innerText = `${count} 天`;
    }

    // 新增特休
    function addLeaveDate() {
        const input = document.getElementById('leaveDateInput');
        const selectedDate = input.value;

        if (!selectedDate) return;
        if (customLeaves.includes(selectedDate)) {
            alert('此日期已在特休列表中！');
            return;
        }

        customLeaves.push(selectedDate);
        customLeaves.sort(); // 排序日期
        localStorage.setItem('customLeaves', JSON.stringify(customLeaves));
        
        input.value = '';
        updateUI();
    }

    // 刪除特休
    function deleteLeaveDate(dateStr) {
        customLeaves = customLeaves.filter(date => date !== dateStr);
        localStorage.setItem('customLeaves', JSON.stringify(customLeaves));
        updateUI();
    }

    // 更新介面
    function updateUI() {
        const listElement = document.getElementById('leaveList');
        listElement.innerHTML = '';

        if (customLeaves.length === 0) {
            listElement.innerHTML = '<li class="leave-item" style="color:#999; justify-content:center;">目前無設定特休</li>';
        } else {
            customLeaves.forEach(date => {
                const li = document.createElement('li');
                li.className = 'leave-item';
                li.innerHTML = `
                    <span>${date}</span>
                    <button class="btn-delete" onclick="deleteLeaveDate('${date}')">刪除</button>
                `;
                listElement.appendChild(li);
            });
        }

        calculateWorkingDays();
    }

    // 首次載入執行
    updateUI();
</script>

</body>
</html>
